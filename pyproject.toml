[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pytest_asyncio.*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "C4", "PIE", "PT", "RET", "TRY"]
ignore = ["PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLR0911", "TRY003", "TRY300", "PLC0415", "RUF001", "RUF002", "RUF003", "E501", "SLF001"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
