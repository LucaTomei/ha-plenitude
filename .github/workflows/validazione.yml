name: Validazione

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands: le immagini sono incluse nell'integrazione (cartella brand/)
          # description, topics: richiesti solo per lo store predefinito di HACS,
          # non per l'installazione come repository personalizzato
          ignore: brands description topics

  test:
    name: Lint e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Dipendenze
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest

  test-versione-minima:
    name: Test con Home Assistant 2025.11 (versione minima)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Dipendenze
        # 0.13.294 = Home Assistant 2025.11.0; pycares 5 non è compatibile con quella versione
        run: pip install "pytest-homeassistant-custom-component==0.13.294" "pycares<5" "pdfplumber==0.11.4"
      - name: Pytest
        run: pytest
